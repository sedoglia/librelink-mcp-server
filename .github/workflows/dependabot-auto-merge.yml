name: Dependabot auto-merge

# Patch- and minor-level Dependabot PRs are queued for auto-merge. GitHub
# holds the merge until the required "ci" checks go green, so a bump that
# breaks the typecheck, build, smoke test or audit stays open instead of
# landing. For a grouped PR, update-type is the largest bump in the group.
#
# Major bumps are deliberately left for a human: the hono 4.x ->
# @hono/node-server 2.x fix in v1.4.0 needed a manual override and a Node
# engines bump, which no automated PR would have made.
#
# The stale sbom.cdx.json that fails the first CI run on every npm bump is
# fixed by dependabot-sbom.yml, which commits the regenerated file and
# re-runs CI; the auto-merge queued here then goes through on its own.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # No approval step on purpose. Branch protection on main requires status
      # checks but no reviews, so an approval would add nothing — and it would
      # need "Allow GitHub Actions to create and approve pull requests", which
      # is off. With it off, gh pr review --approve returns 403, fails the job,
      # and auto-merge is never queued at all.
      - name: Enable auto-merge for patch and minor updates
        if: contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave major updates for manual review
        if: ${{ !contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'), steps.metadata.outputs.update-type) }}
        run: |
          echo "::notice::${{ steps.metadata.outputs.update-type }} update - needs manual review, not auto-merging."
