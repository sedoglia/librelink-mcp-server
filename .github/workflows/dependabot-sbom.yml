name: Dependabot SBOM

# Dependabot only touches package.json and package-lock.json, so every npm
# bump would fail the "SBOM up to date" CI step until someone regenerated
# sbom.cdx.json by hand. This job does it on the PR branch instead.
#
# Three details make the loop close without a human:
#
# - Dispatching ci.yml on the PR branch runs it on the new head commit, and
#   the "ci (22)" / "ci (24)" check runs it produces are the ones branch
#   protection and the queued auto-merge wait for.
#
# - The GITHUB_TOKEN push also creates pull_request runs started by
#   github-actions[bot], which the repo's approval policy holds as
#   action_required. The held CI run's check runs are newer than the
#   dispatched ones and kept PRs #49 and #50 BLOCKED for a week each. The
#   last step below deletes those held runs (only on the pushed commit and
#   only ones started by github-actions[bot]) so the dispatched checks count.
#
# - Dependabot stops rebasing a PR once someone else has pushed to it, which
#   would leave a second open bump stuck in conflict after the first merges.
#   "[dependabot skip]" in the commit message tells Dependabot it may force
#   push over the commit; the rebase re-runs this job, which regenerates the
#   SBOM on the new lockfile.

on: pull_request

permissions:
  contents: write
  actions: write

concurrency:
  group: dependabot-sbom-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sbom:
    # github.actor rather than the PR author: if a human pushes to the branch,
    # the regenerated SBOM is theirs to commit, as for any other PR.
    if: github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The SBOM is built from package-lock.json alone, so there is no
      # `npm ci` here and no dependency install script runs with a write
      # token. sbom:check regenerates the file in place and exits non-zero
      # only when the inventory changed (tool versions are ignored).
      - name: Regenerate SBOM
        id: sbom
        run: |
          if npm run sbom:check; then
            git checkout -- sbom.cdx.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and re-run CI
        id: push
        if: steps.sbom.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sbom.cdx.json
          git commit -m 'chore(sbom): regenerate for dependency update [dependabot skip]'
          git push origin "HEAD:$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          gh workflow run ci.yml --ref "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The held runs appear a few seconds after the push. Poll for up to two
      # minutes, stopping once a pass after the first deletion finds nothing
      # new; if GitHub creates no held runs at all, this just times out.
      - name: Delete runs held for approval
        if: steps.sbom.outputs.changed == 'true'
        run: |
          deleted=0
          for _ in $(seq 1 12); do
            sleep 10
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&status=action_required" \
              --jq '.workflow_runs[] | select(.actor.login == "github-actions[bot]") | .id')
            if [ -z "$ids" ]; then
              if [ "$deleted" -gt 0 ]; then break; fi
              continue
            fi
            for id in $ids; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id"
              echo "Deleted held run $id"
              deleted=$((deleted + 1))
            done
          done
          echo "Deleted $deleted held run(s)."
        env:
          SHA: ${{ steps.push.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
